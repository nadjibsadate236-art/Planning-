
name: Deploy Madrassa to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
            - name: Verify Firebase secret
      env:
        FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MADRASSA_WEB }}
      run: |
        if [ -z "$FIREBASE_KEY" ]; then
          echo "SECRET ABSENT"
          exit 1
        else
          echo "SECRET DETECTE"
        fi

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MADRASSA_WEB }}'
          channelId: live
          projectId: madrassa-web
          
